    body {

    .grid {
      position: relative;
      z-index: 1;

    .dropdown {
      position: relative;
      width: 100%;
    }
    
    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #4E3B31;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      border: 1px solid #ddd;
      border-radius: 8px;
      z-index: 9999;
      animation: dropdown-slide 0.3s ease forwards;
      transform-origin: top center;
    }
    
    .dropdown:hover .dropdown-content {
      display: block;
    }
    
    .dropdown-item {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.2s ease;
      border-bottom: 1px solid #eee;
    }
    
    .dropdown-item:last-child {
      border-bottom: none;
    }
    
    .dropdown-item:hover {
      background-color: #f1f5f9;
    }
    
    @keyframes dropdown-slide {
      0% {
        opacity: 0;
        transform: translateY(-10px) scaleY(0.8);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleY(1);
      }
    }

  <!-- Ajouter un agent -->

<!-- Créer une patrouille -->
<div class="mt-8 scale-90">

  <form id="patrolForm" class="transparent-card space-y-4">
    <select id="unit_type" class="border p-2 w-full">
      <option value="">Unité Spéciale (facultatif)</option>
      <option value="K9">K9</option>

    <div class="space-y-2">
      <select id="agentSelect1" class="border p-2 w-full" required>
        <option value="">Sélectionner 1er agent</option>

      <select id="agentSelect2" class="border p-2 w-full hidden">
        <option value="">Sélectionner 2ème agent (optionnel)</option>

      <select id="agentSelect3" class="border p-2 w-full hidden">
        <option value="">Sélectionner 3ème agent (optionnel)</option>

<!-- Patrouilles Actives -->
<div class="mt-8">
  <h2 class="text-2xl font-semibold mb-2">Patrouilles Actives</h2>
  <div class="transparent-card mt-4">
  <div id="patrols" class="grid gap-4"></div>
</div>

<!-- Ton JavaScript complet commence ici -->
<script>
let allAgents = [];
let allVehicles = [];
let allPatrols = [];

async function fetchAgents() {
  const { data, error } = await supabase.from('agents').select('*');
  if (error) console.error(error);
  allAgents = data || [];
  renderAgentsDropdown();
  updateAgentSelects();
}

async function fetchVehicles() {
  const { data, error } = await supabase.from('vehicles').select('*');
  if (error) console.error(error);
  allVehicles = data || [];
  renderVehiclesDropdown();
  updateVehicleSelect();
}

async function fetchPatrols() {
  const { data, error } = await supabase
    .from('patrols')
    .select(`
      *,
      agents:patrol_agents (
        agent:agent_id (
          id, name, badge
        )
      ),
      vehicle:vehicle_id (
        id, model, plate
      )
    `);

  if (error) {
    console.error(error);
    return;
  }

  allPatrols = (data || []).map(p => ({
    ...p,
    agents: (p.agents || []).map(a => a.agent).filter(Boolean),
    vehicle_model: p.vehicle?.model || '',
    vehicle_plate: p.vehicle?.plate || ''
  }));

  renderPatrols(); // ✅ appeler la fonction
}

function renderAgentsDropdown() {
  const agentsList = document.getElementById('agentsList');
  agentsList.innerHTML = '';
  allAgents.forEach(agent => {
    const div = document.createElement('div');
    div.className = "dropdown-item";
    div.innerHTML = `
      <span>[${agent.badge}] ${agent.name}</span>
      <button onclick="deleteAgent(${agent.id})" class="text-red-500 ml-2">❌</button>
    `;
    agentsList.appendChild(div);
  });
}

function renderVehiclesDropdown() {
  const vehiclesList = document.getElementById('vehiclesList');
  vehiclesList.innerHTML = '';
  allVehicles.forEach(vehicle => {
    const div = document.createElement('div');
    div.className = "dropdown-item";
    div.innerHTML = `
      <span>${vehicle.model} [${vehicle.plate}]</span>
      <button onclick="deleteVehicle(${vehicle.id})" class="text-red-500 ml-2">❌</button>
    `;
    vehiclesList.appendChild(div);
  });
}

function updateAgentSelects() {
  const selects = [document.getElementById('agentSelect1'), document.getElementById('agentSelect2'), document.getElementById('agentSelect3')];
  const selectedIds = selects.map(s => s.value).filter(Boolean);
  const usedBadges = [];
  Object.values(allPatrols).forEach(patrol => {
    patrol.agents.forEach(agent => {
      usedBadges.push(agent.badge);
    });
  });
  selects.forEach(select => {
    const prev = select.value;
    select.innerHTML = '<option value="">Sélectionner agent</option>';
    allAgents.forEach(agent => {
      const option = document.createElement('option');
      option.value = agent.id;
      option.textContent = `[${agent.badge}] ${agent.name}`;
      if (usedBadges.includes(agent.badge) && prev !== agent.id.toString()) {
        option.disabled = true;
      }
      select.appendChild(option);
    });
    select.value = prev;
  });
}

function retirerAgentDuDOM(agentId) {
  const agentsList = document.getElementById("agentsList");
  const agentItem = Array.from(agentsList.children).find(div =>
    div.querySelector('button')?.getAttribute("onclick")?.includes(agentId)
  );
  if (agentItem) {
    agentsList.removeChild(agentItem);
  }
}

function updateVehicleSelect() {
  const vehicleSelect = document.getElementById('vehicleSelect');
  vehicleSelect.innerHTML = '<option value="">Sélectionner Véhicule</option>';
  allVehicles.forEach(vehicle => {
    const option = document.createElement('option');
    option.value = vehicle.id;
    option.textContent = `${vehicle.model} ${vehicle.plate}`;
    vehicleSelect.appendChild(option);
  });
}

function ajouterAgentDansLeDOM(agent) {
  const agentList = document.getElementById('agentsList');

  // Vérifier si l'agent existe déjà
  const exists = Array.from(agentList.children).some(div =>
    div.textContent.includes(agent.badge)
  );
  if (exists) return;

  const div = document.createElement("div");
  div.className = "dropdown-item";
  div.innerHTML = `
    <span>[${agent.badge}] ${agent.name}</span>
    <button onclick="deleteAgent(${agent.id})" class="text-red-500 ml-2">❌</button>
  `;
  agentList.appendChild(div);
}

function ajouterVehiculeDansLeDOM(vehicle) {
  const vehiclesList = document.getElementById('vehiclesList');

  // Vérifie s'il est déjà affiché
  const exists = Array.from(vehiclesList.children).some(div =>
    div.textContent.includes(vehicle.plate)
  );
  if (exists) return;

  const div = document.createElement("div");
  div.className = "dropdown-item";
  div.innerHTML = `
    <span>${vehicle.model} [${vehicle.plate}]</span>
    <button class="text-red-500 ml-2">❌</button>
  `;
  vehiclesList.appendChild(div);
}

document.getElementById('agentForm').addEventListener('submit', async (e) => {
  e.preventDefault(); // empêche le rechargement de la page

  const name = document.getElementById('name').value;
  const badge = document.getElementById('badge').value;

  // Empêche d’ajouter deux agents avec le même badge
  if (allAgents.find(a => a.badge === badge)) {
    alert("Ce matricule existe déjà !");
    return;
  }

  const { error } = await supabase.from('agents').insert([{ name, badge }]);
  if (error) return alert("Erreur ajout agent");

  await fetchAgents();        // recharge la liste des agents
  updateAgentSelects();       // met à jour les menus déroulants
  e.target.reset();           // vide les champs du formulaire
});

document.getElementById('vehicleForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const model = document.getElementById('model').value;
  const plate = document.getElementById('plate').value;

  if (allVehicles.find(v => v.plate === plate)) {
    alert("Cette plaque existe déjà !");
    return;
  }

  const { error } = await supabase.from('vehicles').insert([{ model, plate }]);
  if (error) return alert("Erreur ajout véhicule");

  await fetchVehicles();      // recharge la liste
  updateVehicleSelect();      // met à jour les <select>
  e.target.reset();           // vide le formulaire
});

document.getElementById('agentSelect1').addEventListener('change', () => {
  document.getElementById('agentSelect2').classList.toggle('hidden', !document.getElementById('agentSelect1').value);
  updateAgentSelects();
});

document.getElementById('agentSelect2').addEventListener('change', () => {
  document.getElementById('agentSelect3').classList.toggle('hidden', !document.getElementById('agentSelect2').value);
  updateAgentSelects();
});

document.getElementById('patrolForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  let unit_type = document.getElementById('unit_type').value;
  const agents = [
    document.getElementById('agentSelect1').value,
    document.getElementById('agentSelect2').value,
    document.getElementById('agentSelect3').value
  ].filter(Boolean);
  const vehicleId = document.getElementById('vehicleSelect').value;

  if (!vehicleId || agents.length === 0) {
    alert("Sélectionne au moins un agent et un véhicule !");
    return;
  }

  if (!unit_type) {
  if (agents.length === 1) unit_type = 'Lincoln';
  else if (agents.length === 2) unit_type = 'Adam';
  else if (agents.length === 3) unit_type = 'Tango';
} 

  const { data, error: patrolErr } = await supabase
    .from('patrols')
    .insert([{ unit_type, status: 'Disponible', vehicle_id: vehicleId }])
    .select();

  if (patrolErr || !data || !data[0]) {
    alert("Erreur création patrouille");
    console.error(patrolErr);
    return;
  }

  const patrolId = data[0].id;
  const inserts = agents.map(agentId => ({ patrol_id: patrolId, agent_id: agentId }));
  const { error: linkErr } = await supabase.from('patrol_agents').insert(inserts);
  if (linkErr) {
    alert("Erreur assignation agents");
    console.error(linkErr);
    return;
  }

  // Rafraîchissement
  await fetchPatrols();
  await fetchAgents();
  await fetchVehicles();

  // Reset formulaire
  e.target.reset();
  document.getElementById('agentSelect2').classList.add('hidden');
  document.getElementById('agentSelect3').classList.add('hidden');
});

function adjustPatrolName(originalName, agents) {
  const count = agents.length;
  if (count === 3) return originalName.replace(/^(Adam|Lincoln)/, 'Tango');
  if (count === 2) return originalName.replace(/^(Tango|Lincoln)/, 'Adam');
  if (count === 1) return originalName.replace(/^(Tango|Adam)/, 'Lincoln');
  return originalName;
}

function retirerVehiculeDuDOM(vehicleId) {
  const vehiclesList = document.getElementById("vehiclesList");
  const vehicleItem = Array.from(vehiclesList.children).find(div =>
    div.querySelector('button')?.getAttribute("onclick")?.includes(vehicleId)
  );
  if (vehicleItem) {
    vehiclesList.removeChild(vehicleItem);
  }
}

function renderPatrols() {
  const patrolsDiv = document.getElementById('patrols');
  patrolsDiv.innerHTML = '';

  allPatrols.forEach(patrol => {
    const id = patrol.id;
    const div = document.createElement('div');
    div.className = "patrol-card";

    const adjustedName = adjustPatrolName(patrol.unit_type, patrol.agents);
    const savedSector = localStorage.getItem(`secteur_${id}`) || "";
    const savedStatus = localStorage.getItem(`statut_${id}`) || "disponible";

    const agentsHTML = patrol.agents.map(agent => `
      <div class="flex justify-between items-center">
        <span>[${agent.badge}] ${agent.name}</span>
        <button onclick="removeAgentFromPatrol(${id}, ${agent.id})" class="ml-2 text-red-500">❌</button>
      </div>
    `).join('');

    div.innerHTML = `
      <div class="patrol-agents">
        <h3 class="font-bold">${adjustedName} ${patrol.agents[0]?.badge || ''}</h3>
        ${agentsHTML}
      </div>
      <div class="flex flex-row gap-2 items-center justify-center flex-wrap">
        <select onchange="updateSector(${id}, this.value)" class="text-black bg-white p-1 rounded my-2">
          <option value="Secteur 1" ${savedSector === "Secteur 1" ? "selected" : ""}>Secteur 1</option>
          <option value="Secteur 2" ${savedSector === "Secteur 2" ? "selected" : ""}>Secteur 2</option>
          <option value="Secteur 3" ${savedSector === "Secteur 3" ? "selected" : ""}>Secteur 3</option>
          <option value="Secteur 4" ${savedSector === "Secteur 4" ? "selected" : ""}>Secteur 4</option>
          <option value="Secteur 5" ${savedSector === "Secteur 5" ? "selected" : ""}>Secteur 5</option>
          <option value="Secteur 6" ${savedSector === "Secteur 6" ? "selected" : ""}>Secteur 6</option>
          <option value="Hors Juridiction" ${savedSector === "Hors Juridiction" ? "selected" : ""}>Hors Juridiction</option>
        </select>

        <select onchange="updateStatus(${id}, this.value)" class="text-black bg-white p-1 rounded my-2">
          <option value="disponible" ${savedStatus === "disponible" ? "selected" : ""}>Disponible</option>
          <option value="occupé" ${savedStatus === "occupé" ? "selected" : ""}>Occupé</option>
        </select>
      </div>

      <div class="patrol-vehicle">
        <span class="font-bold">${patrol.vehicle_model || 'Modèle inconnu'} [${patrol.vehicle_plate?.replace(/[\[\]]/g, '') || 'Plaque inconnue'}]</span>
        <button onclick="deletePatrol(${id})" class="text-red-500 mt-2">Supprimer Patrouille ❌</button>
      </div>
    `;

    patrolsDiv.appendChild(div);
  });
}

async function removeAgentFromPatrol(patrolId, agentId) {
  if (!confirm("Retirer cet agent de la patrouille ?")) return;

  const { error } = await supabase.from('patrol_agents').delete().match({
    patrol_id: patrolId,
    agent_id: agentId
  });

  if (error) {
    alert("Erreur retrait agent");
    console.error(error);
    return;
  }

  await fetchPatrols();

  const patrol = allPatrols[patrolId];
  if (patrol && patrol.agents.length === 0) {
    await deletePatrol(patrolId);
  }

  fetchAgents();
}

async function updateStatus(patrolId, statut) {
  const { error } = await supabase.from('patrols').update({ status: statut }).eq('id', patrolId);
  if (error) {
    console.error("Erreur statut :", error.message);
  } else {
    localStorage.setItem(`statut_${patrolId}`, statut); // ✅ MAJ localStorage
    await fetchPatrols(); // ✅ Rafraîchir l'affichage
  }
}

async function deletePatrol(id) {
  if (!confirm("Supprimer cette patrouille complètement ?")) return;

  const { error: agentsError } = await supabase.from('patrol_agents').delete().eq('patrol_id', id);
  const { error: patrolError } = await supabase.from('patrols').delete().eq('id', id);

  if (agentsError || patrolError) {
    alert("Erreur suppression patrouille");
    console.error(agentsError || patrolError);
  } else {
    await fetchPatrols();
    await fetchAgents();
	await fetchVehicles(); // 🔄 au cas où un véhicule était affecté
  }
}

async function updatePatrolField(patrolId, updates) {
  const { error } = await supabase.from('patrols').update(updates).eq('id', patrolId);
    if (!error) {
      await fetchPatrols(); // 🔄 pour voir les changements à l'écran
    }
}

async function updateSector(patrolId, secteur) {
  const { error } = await supabase.from('patrols').update({ sector: secteur }).eq('id', patrolId);
  if (error) {
    console.error("Erreur mise à jour secteur :", error.message);
  } else {
    localStorage.setItem(`secteur_${patrolId}`, secteur); // ✅ MAJ localStorage
    await fetchPatrols(); // ✅ Rafraîchir l'affichage
  }
}

async function deleteAgent(id) {
  if (confirm("Supprimer cet agent ?")) {
    const { error } = await supabase.from('agents').delete().eq('id', id);
    if (error) {
      alert("Erreur suppression agent");
      console.error(error);
    } else {
      await fetchAgents(); // 🔄 recharge la liste visuellement
      updateAgentSelects(); // 🔁 met à jour les menus déroulants
    }
  }
}

async function deleteVehicle(id) {
  if (confirm("Supprimer ce véhicule ?")) {
    const { error } = await supabase.from('vehicles').delete().eq('id', id);
    if (error) {
      alert("Erreur suppression véhicule");
      console.error(error);
    } else {
      await fetchVehicles(); // 🔄 recharge la liste visuellement
      updateVehicleSelect(); // 🔁 met à jour le menu
    }
  }
}


// Appels initiaux pour charger les données dès l'ouverture de la page
window.onload = async () => {
  await fetchAgents();
  await fetchVehicles();
  await fetchPatrols();
};

</script>
