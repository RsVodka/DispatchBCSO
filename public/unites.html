<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Unités Dispatch BCSO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
	body {
	  background-color: #4E3B31;
	  color: white;
	}


    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 3 cases par ligne */
      gap: 20px;
    }

    .unit-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start; /* Aligner les éléments vers le haut */
      align-items: center;
      text-align: center;
      height: auto;
      padding: 10px;
      min-height: 250px; /* Taille minimale de la case */
      margin: 10px;
      border-radius: 12px;
      background-color: #4E3B31; /* Fond des unités */
    }

    .unit-card h3 {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .unit-card select {
      margin-bottom: 12px;
    }

    .unit-card button {
      margin-top: 12px;
      width: 100%;
    }

    .agent-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .agent-item {
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	  width: 100%;             /* prends toute la largeur */
	  background-color: transparent;
	  padding: 0 10px;
	  border-radius: 8px;
	  font-size: 1rem;
	  color: white;
	  height: 30px;
	}


    .agent-item button {
	background-color: transparent;
	color: red;
	border: none;
	font-size: 1.1rem; /* Agrandir la croix pour qu'elle soit plus visible */
	cursor: pointer;
	margin-left: 10px; /* Espacer légèrement la croix du texte */
	display: flex;
	align-items: center; /* Aligner la croix avec le texte */
	}
	
	.agent-item span {
	display: inline-block;
	width: calc(100% - 40px); /* Réduit la largeur du texte pour laisser de la place à la croix */
	word-wrap: break-word; /* Permet de briser les mots longs */
	text-align: center; /* Centrer le texte */
	}

    select {
	background-color: #333; /* Fond sombre */
	color: black; /* Texte noir dans le menu déroulant */
	border-radius: 8px; /* Coins arrondis */
	padding: 8px; /* Un peu d'espace autour du texte */
	width: 100%; /* Prendre toute la largeur disponible */
	font-size: 0.8rem; /* Taille du texte */
	}
	
	/* Modifier la couleur du texte lors de la sélection d'une option */
	select:focus {
	outline: none; /* Supprimer le contour bleu à la sélection */
	color: black; /* Assurez-vous que le texte reste noir lorsqu'il est sélectionné */
	}

    input, select {
      background-color: #f8f9fa;
      color: #333;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 8px;
      width: 100%;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #4E3B31;
    }

    .agent-item span {
      display: inline-block;
      width: calc(100% - 30px); /* Réduit la largeur de l'élément texte */
      word-wrap: break-word; /* Permet de briser les mots longs */
    }

  </style>
</head>
<body class="p-8">

<header class="flex items-center justify-between mb-6">
  <!-- Logo à gauche -->
  <div class="flex items-center">
    <img src="BCSO_Logo.png" alt="Logo BCSO" class="h-28 w-auto" />
  </div>

  <!-- Menu à droite -->
  <nav>
    <ul class="flex space-x-4">
      <li>
        <a href="/" class="flex items-center gap-2 text-white px-4 py-2 rounded-full hover:bg-white/10 transition">
          Dispatch
        </a>
      </li>
      <li>
        <a href="/unites.html" class="flex items-center gap-2 text-white px-4 py-2 rounded-full hover:bg-white/10 transition">
          Unités
        </a>
      </li>
    </ul>
  </nav>
</header>

<h1 class="text-3xl font-bold text-center mb-6">Unités BCSO</h1>

<!-- Ajouter des agents dans les unités -->
<div class="grid grid-cols-3 gap-4 mt-6">

  <!-- Unité SIB -->
  <div class="unit-card" id="SIB-card">
    <h3 class="font-bold">SIB</h3>
    <select id="SIB-select" class="text-black">
      <option value="">Sélectionner un agent</option>
      <!-- Les options seront insérées ici -->
    </select>
	<select id="SIB-rank" class="mt-2 text-black">
	  <option value="">Choisir un grade</option>
	  <option>Recrue</option>
	  <option>Détective I</option>
	  <option>Détective II</option>
	  <option>Détective III</option>
	  <option>Inspecteur</option>
	</select>
    <button class="bg-green-500 text-white p-2 rounded mt-2 w-full" onclick="addAgentToUnit('SIB')">Ajouter Agent</button>
    <div class="agent-list" id="SIB-list">
      <!-- Les agents de SIB seront listés ici -->
    </div>
  </div>
  
  <!-- Unité SRT -->
  <div class="unit-card" id="SRT-card">
    <h3 class="font-bold">SRT</h3>
    <select id="SRT-select" class="text-black">
      <option value="">Sélectionner un agent</option>
      <!-- Les options seront insérées ici -->
    </select>
	<select id="SRT-rank" class="mt-2 text-black">
	  <option value="">Choisir un rôle</option>
	  <option>Recrue</option>
	  <option>Opérateur secondaire</option>
	  <option>Breacher</option>
	  <option>Médic</option>
	  <option>EOD</option>
	  <option>Conducteur</option>
	  <option>THP</option>
	  <option>Chef d'équipe</option>
	  <option>Chef d'unité</option>
	</select>
    <button class="bg-green-500 text-white p-2 rounded mt-2 w-full" onclick="addAgentToUnit('SRT')">Ajouter Agent</button>
    <div class="agent-list" id="SRT-list">
      <!-- Les agents de SRT seront listés ici -->
    </div>
  </div>
  
  <!-- Unité K9 -->
  <div class="unit-card" id="K9-card">
    <h3 class="font-bold">K9</h3>
    <select id="K9-select"> class="text-black">
      <option value="">Sélectionner un agent</option>
      <!-- Les options seront insérées ici -->
    </select>
    <button class="bg-green-500 text-white p-2 rounded mt-2 w-full" onclick="addAgentToUnit('K9')">Ajouter Agent</button>
    <div class="agent-list" id="K9-list">
      <!-- Les agents de K9 seront listés ici -->
    </div>
  </div>

  <!-- Unité William -->
  <div class="unit-card" id="William-card">
    <h3 class="font-bold">William</h3>
    <select id="William-select"> class="text-black">
      <option value="">Sélectionner un agent</option>
      <!-- Les options seront insérées ici -->
    </select>
    <button class="bg-green-500 text-white p-2 rounded mt-2 w-full" onclick="addAgentToUnit('William')">Ajouter Agent</button>
    <div class="agent-list" id="William-list">
      <!-- Les agents de William seront listés ici -->
    </div>
  </div>
  
  <!-- Unité HSU -->
  <div class="unit-card" id="HSU-card">
    <h3 class="font-bold">HSU</h3>
    <select id="HSU-select"> class="text-black">
      <option value="">Sélectionner un agent</option>
      <!-- Les options seront insérées ici -->
    </select>
    <button class="bg-green-500 text-white p-2 rounded mt-2 w-full" onclick="addAgentToUnit('HSU')">Ajouter Agent</button>
    <div class="agent-list" id="HSU-list">
      <!-- Les agents de HSU seront listés ici -->
    </div>
  </div>
  
  <!-- Unité MU -->
  <div class="unit-card" id="MU-card">
    <h3 class="font-bold">MU</h3>
    <select id="MU-select"> class="text-black">
      <option value="">Sélectionner un agent</option>
      <!-- Les options seront insérées ici -->
    </select>
    <button class="bg-green-500 text-white p-2 rounded mt-2 w-full" onclick="addAgentToUnit('MU')">Ajouter Agent</button>
    <div class="agent-list" id="MU-list">
      <!-- Les agents de MU seront listés ici -->
    </div>
  </div>
  
  <!-- Unité ASU -->
  <div class="unit-card" id="ASU-card">
    <h3 class="font-bold">ASU</h3>
    <select id="ASU-select"> class="text-black">
      <option value="">Sélectionner un agent</option>
      <!-- Les options seront insérées ici -->
    </select>
    <button class="bg-green-500 text-white p-2 rounded mt-2 w-full" onclick="addAgentToUnit('ASU')">Ajouter Agent</button>
    <div class="agent-list" id="ASU-list">
      <!-- Les agents de ASU seront listés ici -->
    </div>
  </div>
</div>

<script>
  let allAgents = [];

  // Récupérer les agents depuis l'API
  async function fetchAgents() {
    const res = await fetch('/api/agents');
    allAgents = await res.json();
    renderAgentsDropdown();
  }

  // Fonction pour afficher les agents dans le menu déroulant de chaque unité
  function renderAgentsDropdown() {
    const selects = [
      'SIB-select', 'SRT-select', 'K9-select', 'William-select', 
      'HSU-select', 'MU-select', 'ASU-select'
    ];

    selects.forEach(id => {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">Sélectionner un agent</option>';

      allAgents.forEach(agent => {
        const option = document.createElement('option');
        option.value = agent.id;
        option.textContent = `[${agent.badge}] ${agent.name}`;
        select.appendChild(option);
      });
    });
  }

  function addAgentToUnit(unit) {
	const select = document.getElementById(`${unit}-select`);
	const agentId = select.value;
	const agent = allAgents.find(a => a.id == agentId);
	
	let grade = "";
	if (unit === "SIB") {
	  grade = document.getElementById("SIB-rank").value;
	}
	if (unit === "SRT") {
	  grade = document.getElementById("SRT-rank").value;
	}

	if (!agent) {
    alert("Veuillez sélectionner un agent.");
    return;
	}

	// Vérifier si l'agent est déjà dans l'unité
	const agentList = document.getElementById(`${unit}-list`);
	const existingAgent = Array.from(agentList.children).some(agentItem => {
    return agentItem.querySelector('span').textContent.includes(agent.badge);
  });

  if (existingAgent) {
    alert(`L'agent avec le matricule [${agent.badge}] existe déjà dans l'unité ${unit}.`);
    return;
  }

  const agentItem = document.createElement('div');
  agentItem.className = "agent-item";
  agentItem.innerHTML = `
    <span>[${agent.badge}] ${agent.name}${grade ? ` - ${grade}` : ""}</span>
    <button onclick="removeAgent('${unit}', this)">❌</button>
  `;

  agentList.appendChild(agentItem);

  // Sauvegarder l'agent dans le localStorage
  saveAgentToLocalStorage(unit);
}

  function removeAgent(unit, button) {
	const agentItem = button.parentElement;
	agentItem.remove();

  // 🔄 Mettre à jour le localStorage après suppression
	const agentList = document.getElementById(`${unit}-list`);
	const agents = [];

	agentList.querySelectorAll('.agent-item').forEach(item => {
    agents.push(item.querySelector('span').textContent);
  });

  localStorage.setItem(unit, JSON.stringify(agents));
}

  
  // Charger les agents depuis le localStorage
function loadAgentsFromLocalStorage() {
  const units = ['SIB', 'SRT', 'K9', 'William', 'HSU', 'MU', 'ASU'];

  units.forEach(unit => {
    const savedAgents = JSON.parse(localStorage.getItem(unit));
    if (savedAgents && savedAgents.length > 0) {
      const agentList = document.getElementById(`${unit}-list`);
      savedAgents.forEach(agentText => {
        const agentItem = document.createElement('div');
        agentItem.className = "agent-item";
        agentItem.innerHTML = `
          <span>${agentText}</span>
          <button onclick="removeAgent('${unit}', this)">❌</button>
        `;
        agentList.appendChild(agentItem);
      });
    }
  });
}

  // Charger les agents au démarrage
	window.onload = function() {
	fetchAgents();  // Charger les agents depuis l'API
	loadAgentsFromLocalStorage();  // Charger les agents du localStorage
};

  
  // Sauvegarder dans le localStorage après ajout
function saveAgentToLocalStorage(unit) {
  const agentList = document.getElementById(`${unit}-list`);
  const agents = [];

  agentList.querySelectorAll('.agent-item').forEach(item => {
    agents.push(item.querySelector('span').textContent);
  });

  localStorage.setItem(unit, JSON.stringify(agents));
}


</script>

</body>
</html>
